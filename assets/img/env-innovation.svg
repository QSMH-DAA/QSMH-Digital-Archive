<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset=".45" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset=".55" stop-color="#fde047"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="cells" width="22" height="16" patternUnits="userSpaceOnUse">
      <rect width="22" height="16" fill="url(#panel)"/>
      <path d="M0 0H22M0 0V16" stroke="#bfdbfe" stroke-opacity=".55" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#sky)"/>
  <!-- stars / particles -->
  <g fill="#ecfeff" opacity=".55">
    <circle cx="90" cy="120" r="2"/><circle cx="210" cy="70" r="1.6"/><circle cx="640" cy="90" r="2.2"/>
    <circle cx="720" cy="210" r="1.5"/><circle cx="380" cy="60" r="1.4"/><circle cx="520" cy="150" r="1.8"/>
  </g>
  <circle cx="610" cy="250" r="150" fill="url(#sun)"/>
  <circle cx="610" cy="250" r="62" fill="#fef08a"/>

  <!-- wind turbines -->
  <g stroke="#ecfeff" stroke-linecap="round">
    <g transform="translate(150 430)">
      <line x1="0" y1="0" x2="0" y2="260" stroke-width="7"/>
      <g stroke-width="9">
        <line x1="0" y1="0" x2="0" y2="-110"/><line x1="0" y1="0" x2="95" y2="55"/><line x1="0" y1="0" x2="-95" y2="55"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#ecfeff" stroke="none"/>
    </g>
    <g transform="translate(285 500) scale(.7)">
      <line x1="0" y1="0" x2="0" y2="260" stroke-width="7"/>
      <g stroke-width="9">
        <line x1="0" y1="0" x2="0" y2="-110"/><line x1="0" y1="0" x2="95" y2="55"/><line x1="0" y1="0" x2="-95" y2="55"/>
        <animateTransform attributeName="transform" type="rotate" from="40" to="400" dur="7s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#ecfeff" stroke="none"/>
    </g>
  </g>

  <!-- back hill -->
  <path d="M0 700 C160 610 330 640 470 680 C600 715 700 650 800 620 V1000 H0 Z" fill="url(#hill1)" opacity=".9"/>

  <!-- hospital building -->
  <g transform="translate(330 470)">
    <!-- solar roof -->
    <path d="M-10 40 L40 -10 H380 L330 40 Z" fill="url(#cells)" stroke="#e0f2fe" stroke-width="3"/>
    <rect x="0" y="40" width="340" height="300" rx="10" fill="url(#bldg)"/>
    <!-- green wall -->
    <rect x="0" y="40" width="54" height="300" fill="#16a34a" opacity=".85"/>
    <g fill="#4ade80">
      <circle cx="14" cy="70" r="12"/><circle cx="38" cy="96" r="14"/><circle cx="16" cy="134" r="13"/>
      <circle cx="40" cy="170" r="12"/><circle cx="18" cy="206" r="14"/><circle cx="38" cy="246" r="13"/>
      <circle cx="16" cy="284" r="12"/><circle cx="38" cy="318" r="12"/>
    </g>
    <!-- windows -->
    <g fill="url(#glass)">
      <rect x="80" y="70" width="52" height="40" rx="6"/><rect x="150" y="70" width="52" height="40" rx="6"/><rect x="220" y="70" width="52" height="40" rx="6"/>
      <rect x="80" y="130" width="52" height="40" rx="6"/><rect x="150" y="130" width="52" height="40" rx="6"/><rect x="220" y="130" width="52" height="40" rx="6"/>
      <rect x="80" y="190" width="52" height="40" rx="6"/><rect x="220" y="190" width="52" height="40" rx="6"/>
    </g>
    <!-- leaf emblem on building (not a cross) -->
    <g transform="translate(176 210)">
      <circle r="26" fill="#059669"/>
      <path d="M-11 12 C-11 -6 2 -16 15 -16 C15 2 4 12 -11 12 Z" fill="#ecfccb"/>
    </g>
    <rect x="290" y="70" width="34" height="160" rx="6" fill="url(#glass)"/>
    <!-- door -->
    <rect x="140" y="268" width="72" height="72" rx="8" fill="#0f766e"/>
    <line x1="176" y1="270" x2="176" y2="340" stroke="#99f6e4" stroke-width="3"/>
  </g>

  <!-- front hill -->
  <path d="M0 800 C180 760 320 820 480 800 C620 782 720 750 800 760 V1000 H0 Z" fill="url(#hill2)"/>

  <!-- trees -->
  <g>
    <rect x="96" y="740" width="10" height="60" fill="#713f12"/><circle cx="101" cy="726" r="40" fill="#22c55e"/><circle cx="80" cy="745" r="26" fill="#16a34a"/>
    <rect x="712" y="728" width="10" height="56" fill="#713f12"/><circle cx="717" cy="714" r="36" fill="#22c55e"/><circle cx="738" cy="732" r="22" fill="#15803d"/>
  </g>

  <!-- recycling bins -->
  <g transform="translate(540 790)">
    <rect x="0" y="0" width="44" height="58" rx="6" fill="#facc15"/><rect x="-3" y="-8" width="50" height="10" rx="4" fill="#ca8a04"/>
    <rect x="56" y="0" width="44" height="58" rx="6" fill="#3b82f6"/><rect x="53" y="-8" width="50" height="10" rx="4" fill="#1d4ed8"/>
    <rect x="112" y="0" width="44" height="58" rx="6" fill="#22c55e"/><rect x="109" y="-8" width="50" height="10" rx="4" fill="#15803d"/>
    <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round">
      <path d="M14 30 l8 -12 l8 12 M36 40 h-28"/>
      <path d="M70 22 a10 10 0 1 0 16 0"/>
      <path d="M124 38 c4 -16 14 -20 22 -20 c0 10 -8 20 -22 20 z"/>
    </g>
  </g>

  <!-- water drop -->
  <g transform="translate(470 860)">
    <path d="M0 -34 C14 -14 22 -2 22 10 A22 22 0 0 1 -22 10 C-22 -2 -14 -14 0 -34 Z" fill="#38bdf8"/>
    <path d="M-8 6 a9 9 0 0 0 9 11" stroke="#e0f2fe" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- circular economy ring -->
  <g transform="translate(200 300)" opacity=".9">
    <circle r="62" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="10 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- foreground ground -->
  <path d="M0 900 C200 880 600 900 800 880 V1000 H0 Z" fill="#064e3b" opacity=".55"/>
</svg>
