<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QSMH Archive • เข้าสู่ระบบ</title>
  <meta name="theme-color" content="#047857">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --brand:#059669; --dd:#064e3b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #f4fbf7; font-family: "Kanit", system-ui, sans-serif; }
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: calc(52px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #064e3b, #047857 60%, #0d9488); color: #fff;
      box-shadow: 0 6px 20px -10px rgba(0,0,0,.5);
    }
    .bar a, .bar button {
      display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
      color: #fff; text-decoration: none; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
      font: 500 .9rem "Kanit", sans-serif; cursor: pointer;
    }
    .bar .title { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
    .bar .title img { width: 28px; height: 28px; border-radius: 8px; }
    .bar .title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    iframe { position: fixed; left: 0; right: 0; bottom: 0; top: calc(52px + env(safe-area-inset-top)); width: 100%; height: calc(100% - 52px - env(safe-area-inset-top)); border: 0; background: #fff; }
    .loader { position: fixed; inset: calc(52px + env(safe-area-inset-top)) 0 0; display: grid; place-items: center; gap: 14px; align-content: center; color: var(--dd); background: #f4fbf7; z-index: 2; transition: opacity .4s; }
    .loader.hide { opacity: 0; pointer-events: none; }
    .spin { width: 52px; height: 52px; border-radius: 50%; border: 5px solid #d1fae5; border-top-color: var(--brand); animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    .msg { max-width: 460px; margin: 0 16px; padding: 28px; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 20px 60px -24px rgba(6,78,59,.4); }
    .msg i { font-size: 2.6rem; color: #f59e0b; }
    .msg code { background: #ecfdf5; padding: 2px 6px; border-radius: 6px; }
    @media (max-width: 480px) { .bar .lbl { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <a href="./" aria-label="กลับหน้าแรก"><i class="bi bi-house"></i><span class="lbl">หน้าแรก</span></a>
    <div class="title"><img src="assets/icons/icon.svg" alt=""><span>QSMH Digital Archive</span></div>
    <button type="button" id="reload" aria-label="โหลดใหม่"><i class="bi bi-arrow-clockwise"></i></button>
    <a id="ext" href="#" target="_blank" rel="noopener" aria-label="เปิดในแท็บใหม่"><i class="bi bi-box-arrow-up-right"></i><span class="lbl">แท็บใหม่</span></a>
  </div>
  <div class="loader" id="loader"><div class="spin"></div><div>กำลังเชื่อมต่อระบบ…</div></div>

  <script src="config.js"></script>
  <script>
    (function () {
      var C = window.QSMH_CONFIG || {}, url = (C.appUrl || "").trim(), loader = document.getElementById("loader");
      if (!url) {
        loader.innerHTML = '<div class="msg"><i class="bi bi-exclamation-triangle"></i><h3>ยังไม่ได้ตั้งค่าลิงก์ระบบ</h3>' +
          '<p>ผู้ดูแลระบบ: ใส่ URL ของ Google Apps Script (ลงท้าย <code>/exec</code>) ที่ <code>appUrl</code> ในไฟล์ <code>config.js</code></p>' +
          '<p><a href="./">← กลับหน้าแรก</a></p></div>';
        document.getElementById("ext").style.display = "none";
        return;
      }
      if (!navigator.onLine) {
        loader.innerHTML = '<div class="msg"><i class="bi bi-wifi-off"></i><h3>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h3><p>ระบบต้องใช้อินเทอร์เน็ตเพื่อเข้าสู่ระบบ กรุณาลองใหม่อีกครั้ง</p><p><a href="">ลองใหม่</a></p></div>';
        return;
      }
      document.getElementById("ext").href = url;
      var f = document.createElement("iframe");
      f.src = url; f.title = "QSMH Digital Archive";
      f.allow = "clipboard-write; fullscreen";
      f.addEventListener("load", function () { loader.classList.add("hide"); });
      setTimeout(function () { loader.classList.add("hide"); }, 12000);
      document.body.appendChild(f);
      document.getElementById("reload").onclick = function () { loader.classList.remove("hide"); f.src = url; };
    })();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
